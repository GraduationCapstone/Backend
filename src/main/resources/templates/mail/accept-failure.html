<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>초대 수락 실패</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff0f0; margin: 0; font-family: sans-serif; }
        .container { text-align: center; background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #dc3545; font-size: 2.5em; }
        p { color: #6c757d; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚠️ 초대 수락 실패</h1>
    <p th:text="${errorMessage}">유효하지 않거나 만료된 초대장입니다.</p>
</div>
</body>
</html>
